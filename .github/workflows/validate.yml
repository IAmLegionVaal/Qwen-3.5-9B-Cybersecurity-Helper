name: Validate reference skills and secret hygiene
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Agent Skills
        run: python tools/validate_skills.py skills
      - name: Scan tracked reference files for common secret patterns
        run: python tools/scan_secrets.py .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
